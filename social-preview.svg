    <rect x="24" y="24" width="312" height="350" rx="2" fill="none" stroke="#b8860b" stroke-opacity="0.42" stroke-width="2"/>
    <text x="180" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" letter-spacing="3" fill="#77571f">MYTHICAL HELPER GUILD</text>
    <text x="180" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#b8860b">Certificate</text>
    <text x="180" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#8b5b0e">of Enchantment</text>
    <line x1="68" y1="218" x2="292" y2="218" stroke="#8b5b0e" stroke-opacity="0.32"/>
    <text x="180" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#2c3e50">Trusted helper record</text>
    <text x="180" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4b5563">with QR verification</text>
    <circle cx="114" cy="330" r="38" fill="url(#seal)"/>
    <text x="114" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff5e2">MH</text>
    <rect x="232" y="292" width="62" height="62" fill="#ffffff"/>
    <path d="M240 300h18v18h-18zm28 0h18v18h-18zm-28 28h18v18h-18zm32 32h14v-14h-14zm-10-28h9v9h-9zm-22 26h11v-10h-11zm39-27h8v8h-8z" fill="#111111"/>
  </g>

  <g transform="translate(118 112)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#efd7a2">MYTHICALHELPER</text>
    <text x="0" y="82" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#eef2ff">A certificate</text>
    <text x="0" y="150" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#eef2ff">for the day they ask</text>
    <text x="0" y="218" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#efd7a2">who carried</text>
    <text x="0" y="286" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#efd7a2">the magic.</text>
    <text x="0" y="352" font-family="Inter, Arial, sans-serif" font-size="25" fill="#c9d5ea">Free, open-source, nonprofit, and made for parents.</text>
