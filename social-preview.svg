      <text x="58" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#efd7a2">NO ADS</text>
      <rect x="132" y="0" width="152" height="38" rx="19" fill="#efd7a2" fill-opacity="0.12" stroke="#efd7a2" stroke-opacity="0.32"/>
      <text x="208" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#efd7a2">OPEN SOURCE</text>
      <rect x="300" y="0" width="130" height="38" rx="19" fill="#efd7a2" fill-opacity="0.12" stroke="#efd7a2" stroke-opacity="0.32"/>
      <text x="365" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#efd7a2">FREE USE</text>
