<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MythicalHelper social preview</title>
  <desc id="desc">A certificate for the day they ask who carried the magic.</desc>
  <defs>
    <radialGradient id="skyA" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#2e65b8" stop-opacity="0.62"/>
      <stop offset="62%" stop-color="#09111f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyB" cx="84%" cy="10%" r="48%">
      <stop offset="0%" stop-color="#efd7a2" stop-opacity="0.38"/>
      <stop offset="64%" stop-color="#09111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#07101b"/>
      <stop offset="56%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#11192a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f0df"/>
      <stop offset="100%" stop-color="#e7dfca"/>
    </linearGradient>
    <radialGradient id="seal" cx="42%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#dc5858"/>
      <stop offset="58%" stop-color="#a12626"/>
      <stop offset="100%" stop-color="#701616"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#skyA)"/>
  <rect width="1200" height="630" fill="url(#skyB)"/>

  <g fill="#ffffff" opacity="0.78">
    <circle cx="94" cy="86" r="2"/>
    <circle cx="176" cy="162" r="1.6"/>
    <circle cx="305" cy="78" r="2"/>
    <circle cx="502" cy="128" r="1.5"/>
    <circle cx="721" cy="82" r="2"/>
    <circle cx="918" cy="146" r="1.6"/>
    <circle cx="1047" cy="92" r="2"/>
    <circle cx="1098" cy="248" r="1.6"/>
    <circle cx="82" cy="382" r="1.8"/>
    <circle cx="338" cy="496" r="1.6"/>
    <circle cx="844" cy="522" r="1.8"/>
  </g>

